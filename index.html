<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Stage Peugeot Épinal</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,700&display=swap">
<style>
/* Layout : carnet de stage. Bandeau collant (logo + navigation par pôle), une colonne ; chaque pôle a trois onglets : Missions (avec grille sous chaque mission), Ressources, Mon bilan. */
:root{
  --bg:#f4f5fa; --surface:#ffffff; --ink:#171b2e; --muted:#585d78; --line:#d5d9ea;
  --sapin:#2f3fb0; --sapin-soft:#e2e6fb; --soleil:#ffc94d; --on-soleil:#15251f; --on-accent:#ffffff;
  --ciel:#dfe6f7; --mont1:#9fc3b5; --mont2:#6fa392; --mur:#f1f2f7; --vitre:#c3d6ee; --sol:#c9cddb;
  --ts:#1e8e4a; --s:#9bd15a; --i:#f6a23a; --ti:#d8452f; --on-ts:#ffffff; --on-s:#15251f; --on-i:#15251f; --on-ti:#ffffff;
  --display:"Outfit","Trebuchet MS",system-ui,sans-serif; --body:"Nunito Sans","Verdana",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#101325; --surface:#1a1e36; --ink:#eef0fb; --muted:#aab0cf; --line:#343a5e;
  --sapin:#a9b4ff; --sapin-soft:#262c5c; --on-accent:#101325;
  --ciel:#1c3442; --mont1:#2d4a41; --mont2:#24403a; --mur:#3a4841; --vitre:#3f6b78; --sol:#26332d; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#101325; --surface:#1a1e36; --ink:#eef0fb; --muted:#aab0cf; --line:#343a5e;
  --sapin:#a9b4ff; --sapin-soft:#262c5c; --on-accent:#101325;
  --ciel:#1c3442; --mont1:#2d4a41; --mont2:#24403a; --mur:#3a4841; --vitre:#3f6b78; --sol:#26332d; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:1rem;line-height:1.6}
h1,h2,h3,h4{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance}
p,ul,ol{margin:0} ul,ol{padding-left:1.2rem}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sapin);outline-offset:2px}
a{color:var(--sapin);font-weight:700}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:3px solid var(--sapin)}
.bar .top{display:flex;align-items:center;gap:.7rem;padding:.4rem 16px}
.bar img{width:48px;height:48px;border-radius:50%;flex:none}
.bar .who{flex:1;min-width:0}
.bar .who b{font-family:var(--display);font-size:1.15rem;display:block;line-height:1.1}
.bar .who span{font-size:.72rem;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.nav{display:flex;gap:.4rem;overflow-x:auto;padding:0 16px .5rem}
.nav button{white-space:nowrap;border:2px solid var(--line);background:var(--bg);border-radius:999px;padding:.3rem .85rem;font-weight:700;font-size:.9rem}
.nav button[aria-current=true]{background:var(--sapin);border-color:var(--sapin);color:var(--on-accent)}
main{max-width:50rem;margin:0 auto;padding-inline:16px;padding-block:1.5rem 4rem}
.stack{display:flex;flex-direction:column;gap:1rem}
.big{gap:1.8rem}
.eyebrow{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--sapin);font-weight:700}
h1{font-size:clamp(1.9rem,7vw,2.8rem);font-weight:800} h1 em{font-style:normal;background:var(--soleil);color:var(--on-soleil);padding:0 .2em;border-radius:6px}
h2{font-size:1.5rem} h3{font-size:1.2rem} h4{font-size:1rem}
.small{font-size:.85rem;color:var(--muted)}
.card{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:1.1rem;display:flex;flex-direction:column;gap:.7rem;min-width:0}
.memo{background:var(--sapin-soft);border-radius:16px 16px 16px 4px;padding:.9rem 1rem}
.say{display:flex;gap:.7rem;align-items:flex-start}.say>div{min-width:0}.av{flex:none;width:2.4rem;height:2.4rem;border-radius:50%;background:var(--sapin);color:var(--on-accent);font-family:var(--display);font-weight:800;display:flex;align-items:center;justify-content:center}.nm{display:block;font-size:.8rem;letter-spacing:.04em;text-transform:uppercase;color:var(--sapin)}
.doc{border:2px dashed var(--line);border-radius:12px;padding:.8rem 1rem;background:var(--bg)}
.shop{width:100%;aspect-ratio:3/2;object-fit:cover;object-position:50% 62%;border-radius:16px;display:block;border:2px solid var(--line)}
.shop.brand{aspect-ratio:auto;height:auto;max-width:24rem;align-self:center;background:#000000}
.chips{display:flex;gap:.4rem;flex-wrap:wrap}.chips span{font-size:.78rem;font-weight:700;border-radius:999px;padding:.1rem .7rem;background:var(--soleil);color:var(--on-soleil)}.chips span+span{background:var(--sapin-soft);color:var(--sapin)}
.vise{border-left:5px solid var(--soleil);padding:.2rem 0 .2rem .8rem;font-size:.9rem;display:flex;flex-direction:column;gap:.25rem}.vise .pb{font-family:var(--display);font-size:1.05rem}.vise ul{padding-left:1.1rem}
.aide{border:2px solid var(--line);border-radius:12px;padding:.6rem .9rem;display:flex;flex-direction:column;gap:.4rem;font-size:.9rem}.aide .btn{padding:.35rem .8rem;font-size:.88rem}
.sim{display:flex;flex-direction:column;gap:.45rem}.sim .sq{text-align:left;border:2px solid var(--line);background:var(--bg);border-radius:10px;padding:.45rem .7rem}.sim .sq.on{border-color:var(--sapin);font-weight:700}.sim .rp{margin:0 0 .2rem 1.2rem;border-radius:4px 14px 14px 14px;padding:.45rem .7rem;border:2px solid var(--ts);background:var(--surface)}.sim .rp.no{border-color:var(--ti)}.sim .rp b{font-size:.78rem;text-transform:uppercase;letter-spacing:.04em;display:block}
details.carte{border:2px dashed var(--ti);border-radius:12px;padding:.6rem .9rem;background:var(--bg)}details.carte summary{font-weight:700;cursor:pointer}details.carte>div{margin-top:.5rem}
.chk{display:flex;flex-direction:column;gap:.3rem}.chk label{display:flex;gap:.6rem;align-items:flex-start;font-weight:400}.chk input{margin-top:.35rem;flex:none;width:1.1rem;height:1.1rem}.chk .tot{font-weight:700}
.grid{display:grid;gap:.8rem;grid-template-columns:repeat(auto-fit,minmax(14rem,1fr))}
.kpi{display:grid;gap:.6rem;grid-template-columns:repeat(auto-fit,minmax(9rem,1fr))}
.kpi div{background:var(--sapin-soft);border-radius:12px;padding:.6rem .8rem}
.kpi b{display:block;font-family:var(--display);font-size:1.4rem;font-variant-numeric:tabular-nums}
.pole{text-align:left;align-items:flex-start}
.pill{font-size:.8rem;background:var(--soleil);color:var(--on-soleil);border-radius:999px;padding:.1rem .7rem;font-weight:700;align-self:flex-start}
.track{height:10px;border-radius:999px;background:var(--sapin-soft);overflow:hidden;width:100%}
.track i{display:block;height:100%;background:var(--sapin);border-radius:999px}
.btn{background:var(--sapin);color:var(--on-accent);border:0;border-radius:12px;padding:.6rem 1.1rem;font-weight:700;align-self:flex-start}
.tabs{display:flex;gap:.4rem;flex-wrap:wrap;border-bottom:2px solid var(--line);padding-bottom:.6rem}
.tabs button{border:0;background:transparent;padding:.4rem .8rem;border-radius:10px;font-weight:700}
.tabs button[aria-selected=true]{background:var(--sapin-soft);color:var(--sapin)}
label.f{display:flex;flex-direction:column;gap:.25rem;font-weight:700;font-size:.92rem}
input[type=text],textarea,select{width:100%;padding:.6rem .7rem;border:2px solid var(--line);border-radius:10px;background:var(--bg);font-weight:400}
textarea{min-height:4.5rem;resize:vertical}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:.45rem .5rem;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
table.in td{padding:.2rem} table.in input{min-width:8rem;padding:.4rem .5rem}
.q{display:flex;flex-direction:column;gap:.4rem;padding:.7rem 0;border-bottom:1px dashed var(--line)}
.opts{display:flex;gap:.4rem;flex-wrap:wrap}
.opt{border:2px solid var(--line);background:var(--bg);border-radius:10px;padding:.35rem .8rem;text-align:left}
.opt.good{background:var(--ts);border-color:var(--ts);color:var(--on-ts);font-weight:700}
.opt.bad{background:var(--ti);border-color:var(--ti);color:var(--on-ti)}
.why{font-size:.88rem;color:var(--muted)}
.eval{border:2px solid var(--sapin);border-radius:14px;padding:.9rem;display:flex;flex-direction:column;gap:.6rem;background:var(--bg)}
.eval .ref{font-size:.88rem}
.ind{display:flex;flex-direction:column;gap:.35rem;padding:.5rem 0;border-top:1px solid var(--line)}
.lv{display:grid;gap:.3rem;grid-template-columns:repeat(auto-fit,minmax(8.5rem,1fr))}
.lv label{border:2px solid var(--c);border-radius:10px;padding:.3rem .5rem;font-size:.82rem;cursor:pointer;background:var(--surface);display:flex;align-items:center;gap:.4rem;font-weight:700}
.lv label::before{content:"";width:.8rem;height:.8rem;border-radius:50%;background:var(--c);flex:none}
.lv input{position:absolute;opacity:0}
.lv label:has(input:checked){background:var(--c);color:var(--oc)}
.lv label:has(input:checked)::before{background:var(--oc)}
.lv label:has(input:focus-visible){outline:3px solid var(--ink)}
.l1{--c:var(--ts);--oc:var(--on-ts)} .l2{--c:var(--s);--oc:var(--on-s)} .l3{--c:var(--i);--oc:var(--on-i)} .l4{--c:var(--ti);--oc:var(--on-ti)}
.chip{display:inline-block;border-radius:999px;padding:.05rem .6rem;font-size:.78rem;font-weight:700;background:var(--c);color:var(--oc)}
.chip.l0{--c:var(--line);--oc:var(--ink)}
.poster{border-radius:16px;padding:1.6rem 1.2rem;text-align:center;display:flex;flex-direction:column;gap:.7rem;align-items:center;background:var(--sapin);color:var(--on-accent);max-width:20rem;align-self:center;width:100%;aspect-ratio:3/4;justify-content:center}
.poster.c2{background:var(--soleil);color:var(--on-soleil)} .poster.c3{background:var(--ti);color:var(--on-ti)}
.poster .a{font-family:var(--display);font-size:1.8rem;font-weight:800;line-height:1.05;overflow-wrap:anywhere}
.poster .o{background:var(--surface);color:var(--ink);border-radius:12px;padding:.5rem .8rem;font-weight:700;overflow-wrap:anywhere}
.poster .c{font-size:.8rem;overflow-wrap:anywhere}
pre.out{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:1rem;font-family:var(--body);font-size:.9rem;margin:0}
#print{display:none}
.pr h1{font-size:1.4rem;margin-bottom:.2rem}.pr h2{font-size:1.15rem;margin:1.2rem 0 .3rem;border-bottom:2px solid var(--sapin);padding-bottom:.2rem}.pr h3{font-size:1rem;margin:.9rem 0 .2rem}
.pr .ans{border:1px solid var(--line);border-radius:6px;padding:.35rem .5rem;white-space:pre-wrap;overflow-wrap:anywhere;min-height:1.8rem;margin:.1rem 0 .5rem}
.pr .lab{font-weight:700;font-size:.88rem}.pr .meta{font-size:.85rem;color:var(--muted)}.pr table{margin-bottom:.5rem}.pr .blk{break-inside:avoid}
@media print{
  :root{--bg:#ffffff;--surface:#ffffff;--ink:#15251f;--muted:#56675f;--line:#b9c7bd;--sapin:#1f6f5c;--sapin-soft:#dcefe8}
  body{background:#ffffff}
  body>header,main{display:none!important}
  #print{display:block;padding:0;font-size:11pt}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
footer{font-size:.8rem;color:var(--muted);text-align:center;margin-top:2.5rem}
</style>

</head>

   ind:["Je suis allé(e) vers le client, debout, avec le sourire et le regard","Ma phrase d'accueil était polie et se terminait par une question ouverte","J'ai su réagir quand j'étais déjà occupé(e)","Mon binôme confirme qu'il s'est senti bien accueilli"]},
  {t:"Mission 2 · Je présente la concession à un nouveau client", lieu:"Au hall d'exposition", mode:"Prise de parole enregistrée", tache:"Présentation de l'entreprise et/ou de ses produits et/ou de ses services", crit:"Qualité, maîtrise et utilisation pertinente des informations relevées et sélectionnées sur le marché, l'entreprise et ses produits",
   brief:"Un monsieur qui vient d'emménager vous demande : « Vous faites quoi, exactement, ici ? » Un vendeur ne lit pas un texte : notez seulement cinq mots-clés sur votre pense-bête à partir de la fiche de la concession (page d'accueil), puis présentez-la à voix haute en 45 secondes. Enregistrez-vous sur "+VOC+".",
   fields:[["mots","Mon pense-bête : cinq mots-clés","table",["Mot-clé"],5],["l",REC,"text"]],
   ind:["J'ai parlé sans lire un texte, avec mes mots-clés seulement","J'ai cité au moins quatre services de la concession","Ma présentation dure moins d'une minute et ma voix est claire"]},
  {t:"Mission 3 · Je mène un entretien de découverte", lieu:"À mon bureau de vente", mode:"Jeu de rôle à deux + fiche client", tache:"Découverte, identification et analyse des besoins du client, de ses motivations et de ses freins éventuels", crit:"Qualité du questionnement, de l'écoute et de la reformulation des besoins du client",
   brief:"Mme Lambert veut changer de voiture. Votre camarade joue Mme Lambert avec sa carte, que vous ne devez pas lire. Posez-lui vos questions à l'oral et remplissez la fiche découverte au fur et à mesure, comme nos vendeurs sur leur tablette. Terminez en reformulant à voix haute : « Si je résume, vous cherchez… »",
   carte:"<b>Vous êtes Mme Lambert.</b> Ne donnez une information que si le vendeur pose la bonne question.<ul><li>Vous êtes infirmière à domicile et vous roulez environ 80 km par jour.</li><li>Vous avez deux enfants de 6 et 9 ans.</li><li>Vous voulez dépenser moins en carburant.</li><li>Votre budget : 350 € par mois au maximum.</li><li>Vous avez un garage avec une prise électrique.</li><li>Votre crainte : tomber en panne pendant votre tournée.</li></ul>",
   fields:[["f1","Fiche découverte · Profession","text"],["f2","Kilomètres par jour","text"],["f3","Famille","text"],["f4","Budget mensuel maximum","text"],["f5","Recharge électrique possible à domicile ?","select",["À demander","Oui","Non"]],["f6","Priorité de la cliente","text"],["f7","Frein (ce qui lui fait peur)","text"],["l",REC,"text"]],
   ind:["J'ai posé surtout des questions ouvertes","Ma fiche découverte est complète : je n'ai rien eu à deviner","J'ai reformulé à voix haute tous les besoins de la cliente","J'ai repéré son frein"]}],
 res:[
  ["Réussir son accueil : la règle des 4 × 20","<ul><li><b>Les 20 premières secondes</b> : le client se fait une opinion tout de suite.</li><li><b>Les 20 premiers gestes</b> : je me redresse, je vais vers lui, sans précipitation.</li><li><b>Les 20 centimètres du visage</b> : je regarde le client et je souris.</li><li><b>Les 20 premiers mots</b> : « Bonjour Madame, bienvenue. Que recherchez-vous comme type de véhicule ? »</li></ul><p>À bannir : « Je peux vous aider ? », « C'est pour quoi ? », « Vous cherchez quelque chose ? ».</p>"],
  ["Questions ouvertes, questions fermées","<div class='tw'><table><thead><tr><th></th><th>Question ouverte</th><th>Question fermée</th></tr></thead><tbody><tr><td><b>Réponse</b></td><td>Le client développe</td><td>Oui, non, ou un chiffre</td></tr><tr><td><b>Elle commence par</b></td><td>Comment, pourquoi, que, quel…</td><td>Est-ce que, avez-vous, combien…</td></tr><tr><td><b>Exemple</b></td><td>« Comment utilisez-vous votre voiture au quotidien ? »</td><td>« Avez-vous une prise dans votre garage ? »</td></tr></tbody></table></div>"],
  ["Découvrir puis reformuler","<ol><li><b>Qui ?</b> La famille, le métier.</li><li><b>Quel usage ?</b> Les trajets, les kilomètres, les vacances.</li><li><b>Quel budget ?</b></li><li><b>Quelles priorités ?</b> Confort, sécurité, économies, style…</li><li><b>Quelles craintes ?</b> C'est le frein du client.</li></ol><p>Puis je <b>reformule</b> : « Si je résume, vous cherchez… C'est bien cela ? »</p>"],
  ["Jouer une situation de vente à deux","<ul><li>Le vendeur est <b>debout</b>, le client arrive vers lui.</li><li>Le client lit sa carte en secret et ne donne pas tout d'un coup.</li><li>On ne s'arrête pas en cas d'erreur : un vrai client ne fait pas « pause ».</li><li>À la fin, le client dit au vendeur un point réussi et un conseil.</li><li>Puis on échange les rôles.</li></ul>"]]},

{id:"p2", nom:"Conseil et argumentation", titre:"Proposer la bonne voiture", duree:"2 séances", bloc:"Bloc 1 · Conseiller et vendre",
 memo:"Maintenant que vous connaissez vos clients, il faut leur proposer le bon véhicule et les convaincre, de vive voix. Ici, on ne récite pas une fiche technique : on parle au client de sa vie à lui.",
 doc:"<b>Les trois véhicules du hall</b> (fiches simplifiées et inventées pour l'exercice)<div class='tw'><table><thead><tr><th></th><th>A · Citadine électrique</th><th>B · SUV compact essence</th><th>C · Break familial hybride rechargeable</th></tr></thead><tbody><tr><td><b>Places</b></td><td>5</td><td>5</td><td>5</td></tr><tr><td><b>Coffre</b></td><td>300 litres</td><td>430 litres</td><td>600 litres</td></tr><tr><td><b>Énergie</b></td><td>Autonomie de 400 km, recharge sur une prise en une nuit</td><td>6 litres aux 100 km</td><td>60 km en électrique, puis essence</td></tr><tr><td><b>Mensualité</b></td><td>290 €</td><td>340 €</td><td>450 €</td></tr><tr><td><b>À savoir</b></td><td>Silencieuse, pas de carburant</td><td>Position de conduite haute, à l'aise sur la neige</td><td>Attelage possible pour une remorque</td></tr></tbody></table></div>",
 train:{t:"Brief du matin · J'écoute Thomas présenter une voiture",i:"Thomas, notre vendeur, a présenté la citadine électrique à une cliente qui fait de longues tournées. Classez ses phrases : c'est la méthode CAB que toute l'équipe utilise.",o:["Caractéristique","Avantage","Bénéfice"],items:[
  ["« Elle a une autonomie de 400 km. »",0,"Un fait technique sur la voiture : une caractéristique."],
  ["« Cela permet de rouler plusieurs jours sans recharger. »",1,"C'est vrai pour n'importe quel conducteur : un avantage."],
  ["« Donc pour vous, qui faites 80 km par jour, c'est une semaine de tournées sans penser à la batterie. »",2,"Il parle de la vie de cette cliente : un bénéfice."],
  ["« Elle se recharge sur une simple prise en une nuit. »",0,"On décrit la voiture : une caractéristique."],
  ["« Vous la branchez le soir dans votre garage et elle est prête chaque matin. »",2,"Il reprend ce que la cliente a dit (son garage) : un bénéfice."]]},
 missions:[
  {t:"Mission 1 · J'oriente trois clients vers le bon véhicule", lieu:"Au hall d'exposition", mode:"Décision + annonce au client", tache:"Conseil d'une solution adaptée : produit et/ou service + service(s) associé(s)", crit:"Proposition d'une offre de produits et/ou de services adaptée et cohérente",
   brief:"Trois clients attendent dans le hall. Pour chacun, décidez vers quel véhicule vous l'emmenez. Puis choisissez un des trois clients : votre camarade le joue et vous lui annoncez votre conseil en 30 secondes, devant le tableau des véhicules.",
   doc:"<b>Mme Lambert</b> : 80 km par jour, deux enfants, garage avec prise, veut dépenser moins en carburant, 350 € par mois au maximum.<br><b>M. et Mme Petit</b> : trois enfants, partent en vacances avec une remorque, veulent un grand coffre, budget de 480 € par mois.<br><b>Hugo, 22 ans</b> : habite en appartement sans prise électrique, part skier chaque hiver, 350 € par mois au maximum.",
   fields:[["v1","J'emmène Mme Lambert vers","select",["À choisir"].concat(VEH)],["v2","J'emmène M. et Mme Petit vers","select",["À choisir"].concat(VEH)],["v3","J'emmène Hugo vers","select",["À choisir"].concat(VEH)],["l",REC,"text"]],
   ind:["Chaque véhicule respecte le budget du client","Je n'ai proposé à personne un véhicule qu'il ne peut pas utiliser","À l'oral, j'ai justifié mon conseil avec les besoins du client"]},
  {t:"Mission 2 · Je présente la voiture et je réponds à une objection", lieu:"Devant le véhicule", mode:"Jeu de rôle enregistré", tache:"Argumentation d'une solution (produit et/ou service et prix) et traitement des objections", crit:"Mise en œuvre d'une argumentation convaincante et efficace",
   brief:"Nos vendeurs préparent une fiche argumentaire, en mots-clés, avant chaque rendez-vous. Préparez la vôtre pour Mme Lambert, puis présentez-lui la citadine électrique à voix haute. Votre camarade joue Mme Lambert et vous oppose une objection : répondez-y sans vous démonter. Enregistrez la scène sur "+VOC+".",
   carte:"<b>Vous êtes Mme Lambert.</b> Écoutez les arguments du vendeur. Au bout du deuxième argument, coupez-le gentiment : « Oui, mais j'ai peur de tomber en panne de batterie pendant ma tournée. » Si sa réponse vous rassure, dites-le. Sinon, insistez une fois.",
   fields:[["cab","Ma fiche argumentaire (mots-clés seulement)","table",["Caractéristique","Avantage","Bénéfice pour Mme Lambert"],3],["l",REC,"text"]],
   ind:["J'ai présenté trois arguments complets : caractéristique, avantage, bénéfice","Mes bénéfices parlaient de la vie de Mme Lambert","J'ai accueilli l'objection calmement, sans contredire la cliente","Ma réponse s'appuyait sur un chiffre de la fiche"]},
  {t:"Mission 3 · Je complète le bon de commande", lieu:"À mon bureau de vente", mode:"Jeu de rôle + document professionnel", tache:"Vente(s) additionnelle(s)", crit:"Proposition d'une offre de produits et/ou de services adaptée et cohérente",
   brief:"Mme Lambert a dit oui pour la citadine électrique. Avant de lui faire signer le bon de commande, proposez-lui de vive voix les compléments qui lui seront vraiment utiles. Votre camarade accepte ou refuse comme le ferait une vraie cliente. Cochez ensuite ce qu'elle a accepté : le total se calcule tout seul.",
   carte:"<b>Vous êtes Mme Lambert.</b> Vous acceptez un complément seulement si le vendeur vous explique à quoi il vous servira, à vous. Vous refusez ce qui ne vous concerne pas (vous n'avez rien à transporter sur le toit). Au-delà de 1 400 € de compléments, vous dites que c'est trop.",
   fields:[["veh","Bon de commande · Véhicule","select",VEH],["cli","Cliente","text",0,0,"Mme Lambert"],["acc","Accessoires acceptés par la cliente (prix inventés pour l'exercice)","checks",[["Borne de recharge rapide à domicile, pose comprise",990],["Câble de recharge supplémentaire",199],["Tapis de sol sur mesure",59],["Deux rehausseurs pour enfants",79],["Barres de toit",189]]],["ce","Contrat d'entretien à 19 € par mois","select",["Non proposé","Proposé et accepté","Proposé et refusé"]],["l",REC,"text"]],
   ind:["J'ai proposé des compléments utiles à cette cliente","J'ai expliqué à quoi chacun lui servira, pas seulement son prix","Je n'ai pas insisté après un refus","Mon bon de commande correspond à ce que la cliente a accepté"]}],
 res:[
  ["Choisir la bonne solution","<ol><li>Je relis les besoins du client.</li><li>J'élimine ce qui dépasse son <b>budget</b>.</li><li>J'élimine ce qu'il <b>ne peut pas utiliser</b> (une voiture électrique sans prise pour la recharger, un coffre trop petit).</li><li>Je garde le véhicule qui répond à sa <b>priorité</b>.</li></ol>"],
  ["La méthode CAB","<ul><li><b>C · Caractéristique</b> : un fait sur le produit. « Elle a… »</li><li><b>A · Avantage</b> : ce que cela apporte à tout le monde. « Ce qui permet de… »</li><li><b>B · Bénéfice</b> : ce que cela apporte à ce client. « Donc pour vous… »</li></ul>"],
  ["Répondre à une objection","<ol><li><b>J'écoute</b> jusqu'au bout, sans couper.</li><li><b>Je montre que je comprends</b> : « Je comprends votre inquiétude. »</li><li><b>Je réponds</b> avec un argument précis, un chiffre, un exemple.</li><li><b>Je vérifie</b> : « Est-ce que cela répond à votre question ? »</li></ol><p>Je ne dis jamais « Mais non ! » ni « Vous vous trompez ».</p>"],
  ["La vente additionnelle","<p>C'est proposer, <b>pendant la vente</b>, un produit ou un service qui complète l'achat du client. On la propose une fois le produit principal choisi, jamais avant, avec une phrase comme : « Pour vos tournées, je vous conseille aussi… »</p>"]]},

{id:"p3", nom:"Suivi de la vente", titre:"De la commande à la livraison", duree:"2 séances", bloc:"Bloc 2 · Suivre les ventes",
 memo:"La vente ne s'arrête pas à la signature. Le jour de la livraison, le client doit repartir avec le sourire, et nous devons savoir s'il est satisfait. Je vous confie le dossier de Mme Lambert jusqu'à la remise des clés.",
 doc:"<b>Fiche de commande</b><ul><li>Cliente : Mme Lambert</li><li>Véhicule : citadine électrique, bleue</li><li>Livraison : vendredi 27 novembre à 17 heures, à la concession</li><li>Documents à apporter : permis de conduire, pièce d'identité, attestation d'assurance du nouveau véhicule, justificatif de domicile</li><li>Téléphone de la concession : 03 29 00 00 00 (numéro fictif)</li></ul>",
 train:{t:"Brief du matin · Le planning d'une livraison",i:"Voici les tâches que l'équipe réalise pour chaque livraison. Rangez-les au bon moment : c'est le planning que je vous demanderai de suivre.",o:["Avant la livraison","Le jour J","Après la livraison"],items:[
  ["Vérifier que le véhicule est propre et prêt.",0,"Le véhicule se prépare avant l'arrivée du client."],
  ["Appeler le client pour confirmer le rendez-vous.",0,"On confirme quelques jours avant, pour éviter un oubli."],
  ["Expliquer les commandes du tableau de bord.",1,"La mise en main se fait avec le client, le jour de la livraison."],
  ["Remettre les clés et les documents.",1,"C'est le moment de la livraison."],
  ["Rappeler le client une semaine plus tard pour savoir si tout va bien.",2,"Le suivi continue après la livraison."],
  ["Envoyer le questionnaire de satisfaction.",2,"On interroge le client une fois qu'il a utilisé son véhicule."]]},
 missions:[
  {t:"Mission 1 · Je contrôle le dossier et j'appelle la cliente", lieu:"Au bureau, puis au téléphone", mode:"Check-list + appel enregistré", tache:"Suivi de la livraison et/ou de l'installation du produit", crit:"Efficacité du suivi de la commande",
   brief:"Nous sommes mardi, la livraison est vendredi. Lisez le point d'avancement de l'atelier, cochez ce qui est vraiment prêt et notez ce qu'il reste à faire, et par qui. Appelez ensuite Mme Lambert pour confirmer le rendez-vous : votre camarade décroche, ou vous laissez un message sur "+VOC+".",
   doc:"<b>Point d'avancement, mardi 24 novembre</b><ul><li>Véhicule arrivé et lavé.</li><li>Batterie chargée à 40 %.</li><li>Plaques d'immatriculation posées.</li><li>Tapis de sol commandés, pas encore reçus.</li><li>Certificat d'immatriculation prêt.</li><li>Rendez-vous de livraison pas encore confirmé avec la cliente.</li></ul>",
   fields:[["chk","Check-list de livraison : je coche ce qui est prêt","checks",[["Véhicule propre"],["Batterie chargée à 100 %"],["Plaques posées"],["Accessoires commandés posés"],["Documents du véhicule prêts"],["Rendez-vous confirmé avec la cliente"]]],["reste","Reste à faire avant vendredi","table",["Action","À qui je le demande","Pour quand"],3],["l",REC,"text"]],
   ind:["Je n'ai coché que ce qui est vraiment prêt","J'ai noté chaque action restante avec un responsable et une échéance","Au téléphone, j'ai donné la date, l'heure et le lieu","J'ai rappelé les documents à apporter"]},
  {t:"Mission 2 · Je remets les clés et j'explique le contrat d'entretien", lieu:"Le jour de la livraison", mode:"Jeu de rôle + prise de rendez-vous", tache:"Mise en place du ou des service(s) associé(s)", crit:"Qualité de la mise en œuvre du ou des services associés",
   brief:"Vendredi, 17 heures. Remettez les clés à Mme Lambert, expliquez-lui son contrat d'entretien avec des mots simples et fixez avec elle sa première révision. Pour cela, calculez d'abord combien de kilomètres elle roule par an, puis remplissez le rendez-vous dans le planning de l'atelier.",
   doc:"<b>Le contrat d'entretien</b> (conditions inventées pour l'exercice)<ul><li>19 € par mois : les révisions sont comprises.</li><li>Première révision au bout d'un an ou de 25 000 km, selon ce qui arrive en premier.</li><li>Un véhicule de prêt pendant la révision.</li></ul><p>Mme Lambert roule 80 km par jour, 5 jours par semaine, 46 semaines par an.</p>",
   carte:"<b>Vous êtes Mme Lambert.</b> Vous êtes ravie de votre voiture. Posez deux questions au vendeur : « La révision, c'est quand ? » et « Et moi, je fais comment pour travailler pendant que ma voiture est chez vous ? »",
   fields:[["km","Kilomètres parcourus par an","text",0,0,"80 × … × … = …"],["ech","La première révision arrivera","select",["À déterminer","Au bout d'un an","Au bout de 25 000 km"]],["rdv","Planning de l'atelier","table",["Cliente","Véhicule","Date du rendez-vous","Motif","Véhicule de prêt ?"],1],["l",REC,"text"]],
   ind:["Mon calcul des kilomètres est juste","J'ai fixé la révision à la bonne échéance","J'ai répondu aux deux questions de la cliente avec des mots simples","Le rendez-vous est complet dans le planning"]},
  {t:"Mission 3 · Je dépouille l'enquête de satisfaction", lieu:"Au bureau, puis en réunion d'équipe", mode:"Tableau de bord + compte rendu oral", tache:"Mesure et analyse de la satisfaction client", crit:"Qualité de l'information collectée, saisie et transmise sur la satisfaction client",
   brief:"Les 20 clients livrés en octobre ont répondu à notre questionnaire. Calculez les pourcentages pour mon tableau de bord. Demain, à la réunion d'équipe, vous aurez une minute pour nous dire à voix haute notre point fort, notre point faible et votre proposition. Enregistrez ce compte rendu sur "+VOC+".",
   doc:"<b>Réponses des 20 clients livrés en octobre</b> : accueil, 18 satisfaits · explications le jour de la livraison, 16 satisfaits · date de livraison respectée, 11 satisfaits · propreté du véhicule, 19 satisfaits · recommanderaient la concession, 15.",
   fields:[["t1","Tableau de bord · Accueil (18 sur 20), en %","text"],["t2","Explications à la livraison (16 sur 20), en %","text"],["t3","Date de livraison respectée (11 sur 20), en %","text"],["t4","Propreté du véhicule (19 sur 20), en %","text"],["t5","Recommanderaient la concession (15 sur 20), en %","text"],["l",REC,"text"]],
   ind:["Mes cinq pourcentages sont justes","À l'oral, j'ai nommé le point fort et le point faible","J'ai proposé une amélioration réalisable pour le point faible","Mon compte rendu dure une minute environ"]}],
 res:[
  ["Réussir une livraison","<ul><li><b>Avant</b> : véhicule propre et rechargé, documents prêts, accessoires posés, rendez-vous confirmé.</li><li><b>Le jour J</b> : accueil chaleureux, vérification des documents, explication des commandes, remise des clés.</li><li><b>Après</b> : appel de suivi sous une semaine, questionnaire de satisfaction.</li></ul>"],
  ["L'appel de confirmation","<ol><li>« Bonjour Madame Lambert, (prénom, nom), de la concession Peugeot d'Épinal. »</li><li>« Je vous appelle pour confirmer la livraison de votre véhicule. »</li><li>La date, l'heure, le lieu.</li><li>Les documents à apporter.</li><li>« Avez-vous des questions ? » puis « Très bonne journée, à vendredi. »</li></ol>"],
  ["Calculer un pourcentage","<p><b>Nombre de clients satisfaits ÷ nombre total de clients × 100.</b></p><p>Exemple : 16 clients satisfaits sur 20. 16 ÷ 20 × 100 = 80 %.</p>"],
  ["Rendre compte à l'oral en une minute","<ol><li>Le sujet : « J'ai dépouillé l'enquête d'octobre. »</li><li>Le point fort, avec son chiffre.</li><li>Le point faible, avec son chiffre.</li><li>Ma proposition : « Je propose de… »</li></ol>"]]},

{id:"p4", nom:"Relation client", titre:"Garder le contact avec nos clients", duree:"2 séances", bloc:"Bloc 3 · Fidéliser la clientèle et développer la relation client",
 memo:"Un client qui achète une voiture chez nous reviendra pendant des années pour l'entretien, puis pour la suivante, à condition que nous gardions le contact. Cette semaine, vous tenez le fichier clients et l'accueil de l'atelier.",
 train:{t:"Brief du matin · Le fichier clients",i:"Le fichier clients contient des informations personnelles. Voici ce que j'ai vu cette année dans l'équipe : bon réflexe ou faute professionnelle ?",o:["Bon réflexe","Faute professionnelle"],items:[
  ["Corriger l'adresse d'un client qui vient de déménager.",0,"Un fichier utile est un fichier à jour."],
  ["Écrire dans la fiche d'un client : « pénible, râle tout le temps ».",1,"On n'écrit que des informations utiles et respectueuses : le client peut demander à lire sa fiche."],
  ["Donner le numéro d'une cliente à un ami qui veut lui vendre quelque chose.",1,"Les données des clients sont confidentielles."],
  ["Demander au client s'il accepte de recevoir nos SMS.",0,"Il faut son accord pour lui envoyer des messages commerciaux."],
  ["Retirer de la liste d'envoi un client qui ne veut plus de publicité.",0,"On respecte toujours le choix du client."]]},
 missions:[
  {t:"Mission 1 · Je saisis les fiches clients", lieu:"Au bureau, sur le logiciel clients", mode:"Saisie de données", tache:"Exploitation et mise à jour du système d'information commercial", crit:"Justesse de l'enrichissement et de l'actualisation du SIC",
   brief:"Trois notes traînent sur mon bureau. Saisissez-les dans le fichier clients, sans faute de frappe : une erreur dans un numéro, et le client ne reçoit jamais notre appel.",
   doc:"<b>Note 1</b> : M. Petit a déménagé. Nouvelle adresse : 12 rue des Lilas, 88000 Épinal. Téléphone inchangé : 06 00 00 00 01. Il roule en break hybride.<br><b>Note 2</b> : Mme Lambert a pris livraison de sa citadine électrique le 27 novembre. E-mail : lambert@exemple.example. Téléphone : 06 00 00 00 02. Elle accepte nos SMS.<br><b>Note 3</b> : Hugo Martin (SUV compact, 06 00 00 00 03) ne veut plus recevoir de publicité.<br><span class='small'>Coordonnées fictives.</span>",
   fields:[["fic","Fichier clients","table",["Nom","Adresse","Téléphone","E-mail","Véhicule","Accepte d'être contacté ?"],3],["manq","Informations à demander au client lors de son prochain passage","text"]],
   ind:["J'ai saisi les informations sans erreur","J'ai respecté le choix de chaque client d'être contacté ou non","J'ai repéré les informations qui manquent"]},
  {t:"Mission 2 · J'envoie les SMS de suivi", lieu:"Au bureau, sur l'outil d'envoi de SMS", mode:"Message professionnel", tache:"Mise en œuvre des outils de fidélisation client", crit:"Cohérence du choix des outils de fidélisation de la clientèle et/ou de développement de la relation client avec le contexte",
   brief:"Chaque mois, nous envoyons des SMS de suivi. Rédigez-en deux, de 160 caractères au maximum : le compteur vous aide. Le premier rappelle à M. Petit que sa révision annuelle arrive dans un mois. Le second demande à Mme Lambert, un mois après sa livraison, si tout se passe bien. Vérifiez d'abord dans le fichier qui accepte d'être contacté.",

function filled(id, f){ if (f[2] === "sim" || f[2] === "checks") return f[3].some((_,k) => val(id+"-"+k)); if (f[2] === "select") return true; if (f[2] !== "table") return val(id).trim() !== ""; for (let r = 0; r < f[4]; r++) if (val(id+"-"+r+"-0").trim()) return true; return false; }
function progress(p){ const ids = fieldIds(p); let done = ids.filter(x => filled(x[0], x[1])).length, tot = ids.length;
  p.missions.forEach((m,mi) => m.ind.forEach((_,i) => { tot++; if (S.g[p.id+"-"+mi+"-"+i]) done++; }));
  p.train.items.forEach((_,i) => { tot++; if (S.t[p.id+"-"+i] != null) done++; });
  return Math.round(done / tot * 100); }

function renderNav(){
  const items = [["home","Accueil"]].concat(POLES.map((p,i) => [p.id, "Pôle "+(i+1)]), [["dossier","Mon dossier"]]);
  $("nav").innerHTML = items.map(x => `<button data-view="${x[0]}" aria-current="${S.view === x[0]}">${x[1]}</button>`).join("");
}
function checkTotal(id, f){ return f[3].reduce((t,it,k) => t + (val(id+"-"+k) ? (it[1] || 0) : 0), 0); }
function checkList(id, f){ return f[3].filter((it,k) => val(id+"-"+k)).map(it => it[0]); }
function fieldById(id){ for (const p of POLES) for (let mi = 0; mi < p.missions.length; mi++) for (const f of p.missions[mi].fields) if (p.id+"-"+mi+"-"+f[0] === id) return f; return null; }
function findField(id){ for (const p of POLES) for (let mi = 0; mi < p.missions.length; mi++) for (const f of p.missions[mi].fields) if (f[2] === "checks" && id.startsWith(p.id+"-"+mi+"-"+f[0]+"-")) return [p.id+"-"+mi+"-"+f[0], f]; return null; }
function fieldHTML(id, f){
  const ph = f[5] ? ` placeholder="${esc(f[5])}"` : "";
  if (f[2] === "table") return `<div class="stack" style="gap:.3rem"><b style="font-size:.92rem">${f[1]}</b><div class="tw"><table class="in"><thead><tr>${f[3].map(c => `<th>${c}</th>`).join("")}</tr></thead><tbody>${
    Array.from({length:f[4]}, (_,r) => `<tr>${f[3].map((c,k) => `<td><input type="text" id="${id}-${r}-${k}" aria-label="${esc(c)}, ligne ${r+1}" value="${esc(val(id+"-"+r+"-"+k))}"></td>`).join("")}</tr>`).join("")}</tbody></table></div></div>`;
  if (f[2] === "sim") { const n = f[3].filter((_,k) => val(id+"-"+k)).length, full = n >= f[4];
    return `<div class="sim" id="${id}-sim"><b style="font-size:.92rem">${f[1]}</b><span class="small">${f[4] > 1 ? "Choix utilisés : " + n + " sur " + f[4] : "Un seul choix possible"}</span>${f[3].map((it,k) => { const on = val(id+"-"+k);
      return `<button class="sq ${on ? "on" : ""}" data-sim="${id}|${k}" ${on || full ? "disabled" : ""}>${esc(it[0])}</button>${on ? `<div class="rp ${it[2] ? "" : "no"}"><b>${f[5]}</b>${esc(it[1])}</div>` : ""}`; }).join("")}${n ? `<button class="btn" data-simreset="${id}" style="background:transparent;color:var(--ink);border:2px solid var(--line);font-size:.85rem;padding:.3rem .8rem">Recommencer la simulation</button>` : ""}</div>`; }
  if (f[2] === "checks") return `<div class="chk"><b style="font-size:.92rem">${f[1]}</b>${f[3].map((it,k) => `<label><input type="checkbox" id="${id}-${k}" ${val(id+"-"+k) ? "checked" : ""}>${it[0]}${it[1] ? " · " + it[1] + " €" : ""}</label>`).join("")}${f[3][0][1] ? `<span class="tot" id="${id}-tot">Total des accessoires : ${checkTotal(id, f)} €</span>` : ""}</div>`;
  if (f[2] === "select") return `<label class="f">${f[1]}<select id="${id}">${f[3].map(o => `<option ${val(id) === o ? "selected" : ""}>${o}</option>`).join("")}</select></label>`;
  if (f[2] === "area") return `<label class="f">${f[1]}<textarea id="${id}"${ph}>${esc(val(id))}</textarea>${f[6] ? `<span class="small" id="${id}-n" data-max="${f[6]}">${val(id).length} / ${f[6]} caractères</span>` : ""}</label>`;
  return `<label class="f">${f[1]}<input type="text" id="${id}" value="${esc(val(id))}"${ph}></label>`;
}
function posterHTML(){ const k = "p1-2-"; const c = {"Jaune":"c2","Rouge":"c3"}[val(k+"coul")] || "";
  return `<div class="poster ${c}" id="poster"><span class="a">${esc(val(k+"accroche") || "Votre accroche ici")}</span><span class="o">${esc(val(k+"offretxt") || "Ce que vous proposez")}</span><span class="c">${esc(val(k+"cond") || "Quand et où ?")}</span></div>`; }
function trainItem(p, i){ const it = p.train.items[i], a = S.t[p.id+"-"+i];
  return `<div class="q" id="tr-${p.id}-${i}"><span>${esc(it[0])}</span><div class="opts">${p.train.o.map((o,j) => `<button class="opt ${a != null && j === it[1] ? "good" : a === j ? "bad" : ""}" data-tr="${p.id}|${i}|${j}" ${a != null ? "disabled" : ""}>${o}</button>`).join("")}</div>${a != null ? `<span class="why">${a === it[1] ? "Sophie : « Exactement. » " : "Sophie : « Pas tout à fait. » "}${esc(it[2])}</span>` : ""}</div>`; }
function evalHTML(p, m, mi){
  return `<div class="eval"><h4>Je m'auto-évalue</h4><p class="small"><b>Sophie :</b> « Avant de me rendre votre travail, relisez-le et évaluez-le honnêtement, comme je le ferai moi-même. »</p><p class="ref"><b>Critère du référentiel :</b> ${m.crit}</p>${m.ind.map((t,i) => { const k = p.id+"-"+mi+"-"+i;
    return `<div class="ind"><span><b>Indicateur :</b> ${t}</span><div class="lv" role="radiogroup" aria-label="${esc(t)}">${LV.map((l,j) => `<label class="l${j+1}"><input type="radio" name="g-${k}" value="${j+1}" ${S.g[k] == j+1 ? "checked" : ""}>${l}</label>`).join("")}</div></div>`; }).join("")}</div>`;
}
function nadia(txt){ return `<div class="memo say"><span class="av" aria-hidden="true">S</span><div><b class="nm">Sophie Marchal · responsable de la concession</b><p>${txt}</p></div></div>`; }
function viseHTML(p, mi){ const x = EXTRA[p.id+"-"+mi], m = p.missions[mi];
  return `<div class="vise"><span class="small" style="text-transform:uppercase;letter-spacing:.06em;font-weight:700">Problématique</span><span class="pb">${x.pb}</span><span><b>Tâche visée :</b> ${m.tache}</span><span><b>Compétence${x.comp.length > 1 ? "s" : ""} visée${x.comp.length > 1 ? "s" : ""} :</b></span><ul>${x.comp.map(c => `<li>${c}</li>`).join("")}</ul><span class="small">${p.bloc} · référentiel du bac pro Métiers du commerce et de la vente</span></div>`; }
function aideHTML(p, mi){ const x = EXTRA[p.id+"-"+mi];
  return `<div class="aide"><span><b>Sophie :</b> « Vous n'y arrivez pas ? Un professionnel cherche d'abord par lui-même. Ouvrez ${x.aide.length > 1 ? "ces fiches" : "cette fiche"} : ${x.aide.map(i => "<b>" + p.res[i][0] + "</b>").join(", ")}. »</span><button class="btn" data-tab="${p.id}|res">Ouvrir les fiches ressources</button></div>`; }
function bonusItem(p, i){ const it = BONUS[p.id][i], a = S.b[p.id+"-"+i];
  return `<div class="q" id="bo-${p.id}-${i}"><span><b>${i+1}.</b> ${esc(it[0])}</span><div class="opts">${it[1].map((_,k) => (k + i * 2 + +p.id[1]) % it[1].length).map(j => `<button class="opt ${a != null && j === it[2] ? "good" : a === j ? "bad" : ""}" data-bo="${p.id}|${i}|${j}" ${a != null ? "disabled" : ""}>${esc(it[1][j])}</button>`).join("")}</div>${a != null ? `<span class="why">${a === it[2] ? "Exact. " : "À revoir. "}${esc(it[3])}</span>` : ""}</div>`; }
function bonusScore(p){ const its = BONUS[p.id]; const done = its.filter((_,i) => S.b[p.id+"-"+i] != null).length, ok = its.filter((it,i) => S.b[p.id+"-"+i] === it[2]).length;
  return done === its.length ? "Mon score : " + ok + " / " + its.length : done + " question" + (done > 1 ? "s" : "") + " sur " + its.length; }
function renderPole(p, n){
  const tab = S.tab[p.id] || "missions";
  let body = "";
  if (tab === "missions") body = (p.doc ? `<div class="card"><div class="doc">${p.doc}</div></div>` : "") + `<div class="card"><h3>${p.train.t}</h3>${nadia(p.train.i)}${p.train.items.map((_,i) => trainItem(p,i)).join("")}</div>` +
    p.missions.map((m,mi) => `<div class="card"><h3>${m.t}</h3><div class="chips"><span>${m.lieu}</span><span>${m.mode}</span></div>${viseHTML(p, mi)}<h4>Mise en situation</h4>${nadia(m.brief)}${m.doc ? `<div class="doc">${m.doc}</div>` : ""}${m.carte ? `<details class="carte"><summary>Carte du client · à ouvrir seulement par l'élève qui joue le client</summary><div>${m.carte}</div></details>` : ""}${m.fields.map(f => fieldHTML(p.id+"-"+mi+"-"+f[0], f)).join("")}${m.affiche ? `<h4>Aperçu de la maquette</h4>${posterHTML()}` : ""}${aideHTML(p, mi)}${evalHTML(p, m, mi)}<button class="btn" data-pdf="${p.id}|${mi}">Enregistrer cette mission en PDF</button><p class="small">Dans la fenêtre qui s'ouvre, choisissez « Enregistrer au format PDF », puis rangez le fichier dans votre dossier de classe.</p></div>`).join("");
  if (tab === "res") body = nadia("Voici les fiches que je remets à chaque nouveau membre de l'équipe. Gardez-les sous la main pendant vos missions.") + p.res.map(r => `<div class="card"><h3>${r[0]}</h3>${r[1]}</div>`).join("");
  if (tab === "bonus") body = nadia("Avant de clore ce dossier, vérifions que vous avez retenu l'essentiel de mes fiches. Cinq questions rapides, pour vous : en cas d'erreur, retournez lire la fiche concernée.") + `<div class="card"><h3>Bonus · Je révise les fiches du pôle</h3>${BONUS[p.id].map((_,i) => bonusItem(p,i)).join("")}<p class="tot" id="bo-score-${p.id}" style="font-weight:700">${bonusScore(p)}</p><button class="btn" data-boreset="${p.id}" style="background:transparent;color:var(--ink);border:2px solid var(--line)">Recommencer</button></div>`;
  if (tab === "bilan") body = nadia("Faisons le point sur ce dossier. Voici comment vous avez évalué votre travail : dites-moi ce que vous avez le mieux réussi et ce que vous voulez encore travailler.") + `<div class="card"><h3>Mes auto-évaluations du pôle</h3><p class="small">${p.bloc} (référentiel du bac pro Métiers du commerce et de la vente)</p><div class="tw"><table><thead><tr><th>Tâche du référentiel</th><th>Indicateur</th><th>Mon niveau</th></tr></thead><tbody>${
      p.missions.map((m,mi) => m.ind.map((t,i) => { const g = S.g[p.id+"-"+mi+"-"+i] || 0; return `<tr><td>${i === 0 ? "<b>"+m.tache+"</b>" : ""}</td><td>${t}</td><td><span class="chip l${g}">${g ? LV[g-1] : "À compléter"}</span></td></tr>`; }).join("")).join("")}</tbody></table></div></div>
    <div class="card">${fieldHTML(p.id+"-bilan-ok", ["","Ce que j'ai le mieux réussi dans ce pôle","area"])}${fieldHTML(p.id+"-bilan-plus", ["","Ce que je dois encore travailler","area"])}</div>`;
  return `<div class="stack"><span class="eyebrow">Pôle ${n} · ${p.nom} · ${p.duree}</span><h1>${p.titre}</h1>${nadia(p.memo)}</div>
    <div class="tabs" role="tablist">${[["missions","Missions"],["res","Ressources"],["bilan","Mon bilan"],["bonus","Bonus"]].map(t => `<button role="tab" data-tab="${p.id}|${t[0]}" aria-selected="${tab === t[0]}">${t[1]}</button>`).join("")}</div>
    <div class="stack">${body}</div>`;
}
function renderHome(){

  <div class="card"><h2>Notre concession en bref</h2>
    <div class="kpi"><div><b>28</b>collaborateurs</div><div><b>40</b>véhicules exposés</div><div><b>25</b>voitures à l'atelier chaque jour</div></div>

}
function dossierText(){
  let out = "MON STAGE CHEZ PEUGEOT ÉPINAL · Dossier de " + (val("eleve") || "(prénom et nom à compléter)") + "\n";
  POLES.forEach((p,n) => { out += "\n==============================\nPÔLE " + (n+1) + " · " + p.nom.toUpperCase() + " (" + progress(p) + " %)\n";
    p.missions.forEach((m,mi) => { out += "\n" + m.t + "\nProblématique : " + EXTRA[p.id+"-"+mi].pb + "\nTâche visée : " + m.tache + "\nCompétences visées : " + EXTRA[p.id+"-"+mi].comp.join(" ; ") + "\n"; m.fields.forEach(f => { const id = p.id+"-"+mi+"-"+f[0];
      if (f[2] === "table") { out += "- " + f[1] + " :\n"; for (let r = 0; r < f[4]; r++) { const row = f[3].map((c,k) => val(id+"-"+r+"-"+k)); if (row.some(x => x.trim())) out += "    " + row.join(" | ") + "\n"; } }
      else if (f[2] === "sim") out += "- " + f[1] + " :\n" + (f[3].filter((_,k) => val(id+"-"+k)).map(it => "    > " + it[0] + "\n      " + f[5] + " : " + it[1]).join("\n") || "    —") + "\n";
      else if (f[2] === "checks") out += "- " + f[1] + " : " + (checkList(id, f).join(" ; ") || "—") + (f[3][0][1] ? " (total : " + checkTotal(id, f) + " €)" : "") + "\n";
      else out += "- " + f[1] + " : " + (val(id) || (f[2] === "select" ? f[3][0] : "—")) + "\n"; });
      out += "Auto-évaluation (critère : " + m.crit + ")\n"; m.ind.forEach((t,i) => { const g = S.g[p.id+"-"+mi+"-"+i]; out += "  [" + (g ? LV[g-1] : "non évalué") + "] " + t + "\n"; }); });
    out += "\nBonus révision : " + bonusScore(p) + "\n\nBilan du pôle\n- Mieux réussi : " + (val(p.id+"-bilan-ok") || "—") + "\n- À travailler : " + (val(p.id+"-bilan-plus") || "—") + "\n"; });
  return out;
}

    else if (f[2] === "sim") h += `<div class="blk"><p class="lab">${f[1]}</p><div class="ans">${esc(f[3].filter((_,k) => val(id+"-"+k)).map(it => "> " + it[0] + "\n   " + f[5] + " : " + it[1]).join("\n"))}</div></div>`;
    else if (f[2] === "checks") h += `<div class="blk"><p class="lab">${f[1]}</p><div class="ans">${f[3].map((it,k) => (val(id+"-"+k) ? "☑ " : "☐ ") + it[0] + (it[1] ? " · " + it[1] + " €" : "")).join("\n")}${f[3][0][1] ? "\nTotal : " + checkTotal(id, f) + " €" : ""}</div></div>`;
    else h += `<div class="blk"><p class="lab">${f[1]}</p><div class="ans">${esc(val(id) || (f[2] === "select" ? f[3][0] : ""))}</div></div>`; });
  h += `<div class="blk"><h3>Mon auto-évaluation</h3><p class="meta"><b>Critère :</b> ${m.crit}</p><table><tbody>${m.ind.map((t,i) => { const g = S.g[p.id+"-"+mi+"-"+i] || 0; return `<tr><td>${t}</td><td><span class="chip l${g}">${g ? LV[g-1] : "Non évalué"}</span></td></tr>`; }).join("")}</tbody></table></div>`;
  return h;
}
function printOut(what){

      h += `<div class="blk"><h3>Bilan du pôle ${n+1}</h3><p class="lab">Ce que j'ai le mieux réussi</p><div class="ans">${esc(val(p.id+"-bilan-ok"))}</div><p class="lab">Ce que je dois encore travailler</p><div class="ans">${esc(val(p.id+"-bilan-plus"))}</div></div>`; });

}
function render(){

}
document.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.view) { S.view = b.dataset.view; save(); render(); window.scrollTo(0,0); }
  else if (b.dataset.tab) { const [p,t] = b.dataset.tab.split("|"); S.tab[p] = t; save(); render(); if (b.closest(".aide")) window.scrollTo(0,0); }
  else if (b.dataset.tr) { const [p,i,j] = b.dataset.tr.split("|"); S.t[p+"-"+i] = +j; save(); $("tr-"+p+"-"+i).outerHTML = trainItem(POLES.find(x => x.id === p), +i); }
  else if (b.dataset.sim) { const [id,k] = b.dataset.sim.split("|"); S.v[id+"-"+k] = "1"; save(); $(id+"-sim").outerHTML = fieldHTML(id, fieldById(id)); }
  else if (b.dataset.simreset) { const id = b.dataset.simreset, f = fieldById(id); f[3].forEach((_,k) => delete S.v[id+"-"+k]); save(); $(id+"-sim").outerHTML = fieldHTML(id, f); }
  else if (b.dataset.bo) { const [p,i,j] = b.dataset.bo.split("|"), P = POLES.find(x => x.id === p); S.b[p+"-"+i] = +j; save(); $("bo-"+p+"-"+i).outerHTML = bonusItem(P, +i); $("bo-score-"+p).textContent = bonusScore(P); }
  else if (b.dataset.boreset) { BONUS[b.dataset.boreset].forEach((_,i) => delete S.b[b.dataset.boreset+"-"+i]); save(); render(); }
  else if (b.dataset.pdf) printOut(b.dataset.pdf);
  else if (b.id === "copy") { const t = dossierText(); const ok = () => $("copied").textContent = "Dossier copié.";
    const ko = () => { const r = document.createRange(); r.selectNodeContents($("out")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); $("copied").textContent = "Le texte est sélectionné : faites Copier."; };
    try { navigator.clipboard.writeText(t).then(ok, ko); } catch(err) { ko(); } }
});
document.addEventListener("input", e => {
  const el = e.target;
  if (el.type === "radio") { S.g[el.name.slice(2)] = +el.value; save(); return; }
  if (el.type === "checkbox") { S.v[el.id] = el.checked ? "1" : ""; save(); const ff = findField(el.id); if (ff && $(ff[0]+"-tot")) $(ff[0]+"-tot").textContent = "Total des accessoires : " + checkTotal(ff[0], ff[1]) + " €"; return; }
  if (!el.id) return;
  S.v[el.id] = el.value; save();
  const n = $(el.id+"-n"); if (n) { n.textContent = el.value.length + " / " + n.dataset.max + " caractères"; n.style.color = el.value.length > +n.dataset.max ? "var(--ti)" : ""; }
  if ($("poster") && el.id.startsWith("p1-2-")) $("poster").outerHTML = posterHTML();
});
render();
</script>

</body>
</html>
